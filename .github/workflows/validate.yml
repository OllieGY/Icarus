name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate skills, frontmatter and public language
        run: node tools/scripts/validate-skills.mjs

      - name: Strict YAML parse of every frontmatter
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, sys, yaml
          bad = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules")]
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  p = os.path.join(root, f)
                  raw = open(p, encoding="utf-8").read()
                  if not raw.startswith("---"):
                      continue
                  end = raw.find("\n---", 3)
                  if end == -1:
                      continue
                  try:
                      yaml.safe_load(raw[4:end])
                  except Exception as e:
                      bad.append((p, str(e).split("\n")[0]))
          for p, e in bad:
              print(f"INVALID {p}: {e}")
          print(f"{len(bad)} invalid frontmatter block(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Rewrite script is idempotent
        run: python3 tools/scripts/rewrite-public.py --check

      - name: Plugin manifests parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json; json.load(open('hooks/hooks.json'))"

      # claude plugin validate / eval run only where the CLI is available; the job stays
      # green without it rather than pretending the checks ran.
      - name: Plugin schema check
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not present; skipping schema check"
          fi
