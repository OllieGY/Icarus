name: hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the hub
        run: node tools/scripts/validate-skills.mjs
      - name: Test the markdown renderer
        run: node --test tools/scripts/lib/markdown.test.mjs
      - name: Check the site data is current
        run: node tools/scripts/build-site.mjs --check

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
